<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Javascript Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>UK Rail Express Service</h1>
    </header>
    <div class="container">
        <div class="form-container">
            <div class="form-section">
                <h2>Check Railway Station</h2>
                <form id="train-form">
                    <label for="station">Station Code:</label>
                    <input type="text" id="station" name="station" required>
                    <button type="submit">Get Train Info</button>
                </form>
                <div id="results"></div>
            </div>
            
            <div id="booking-container" class="form-section" style="display:none;">
                <h2>Book a Ticket</h2>
                <form id="booking-form">
                    <label for="from-station">From Station Code:</label>
                    <input type="text" id="from-station" name="from-station" required>
                    <label for="to-station">To Station Code:</label>
                    <input type="text" id="to-station" name="to-station" required>
                    <label for="num-tickets">Number of Tickets:</label>
                    <input type="number" id="num-tickets" name="num-tickets" required>
                    <button type="submit">Book Ticket</button>
                </form>
            </div>
        </div>
        
        <div id="qr-container" class="form-section" style="display:none;">
            <h2>Here is your ticket, please scan:</h2>
            <div id="qrcode"></div>
        </div>
    
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
<footer>
    <div class="link-section">
        <a href="https://en.wikipedia.org/wiki/UK_railway_stations_%E2%80%93_A" target="_blank">UK Railway Stations Info</a>
    </div>
</footer>
</html>
